<h2 mat-dialog-title>Apagar marca</h2>
<mat-dialog-content>
    Tem certeza que deseja apagar a marca?

    <div>
        <p>Ao apagar uma marca, todos os produtos associados a ela serão permanentemente removidos.</p>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-button mat-dialog-close cdkFocusInitial (click)="onYes()">Sim</button>
</mat-dialog-actions>
