<h2 mat-dialog-title>Editar marca</h2>

<mat-dialog-content>
  <div class="form-container">
  
    <form [formGroup]="myProductForm" enctype="multipart/form-data">
      <div class="view-image">
        <img [src]="imageSrc" alt="Selecione uma imagem" class="card-img" id="uploaded-image" src="#">
        <div class="card-body">
          <input type="file" accept="image/*" formControlName="produto_image" required="true"
            (change)="onFileSelected($event)" class="form-control" id="upload-input">
        </div>
      </div>
  
      <div class="form-inputs">
        <label>
          Nome do produto
          <input type="text" formControlName="product_name" [placeholder]="myProductForm.value.product_name"
            required="true">
        </label>
  
        <label>
          Preço do produto
          <input type="text" formControlName="product_price"
            [placeholder]="myProductForm.value.product_price| currency: 'BRL'" required="true">
        </label>
  
        <label>
          Descrição
          <input type="text" formControlName="product_description" [placeholder]="myProductForm.value.product_description"
            required="true" maxlength="40">
        </label>
  
        <label>
          <mat-form-field>
            <mat-label>Marca</mat-label>
            <mat-select [formControl]="myProductForm.controls.product_marca" [(ngModel)]="selectedMarca"
              (selectionChange)="setMarca(selectedMarca())">
              @for (marca of arrayMarcas; track marca) {
              <mat-option [value]="marca">{{marca}}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </label>
  
        <label>
          <mat-form-field>
            <mat-label>Categoria</mat-label>
            <mat-select [formControl]="myProductForm.controls.product_categoria">
              <mat-select-trigger>
                {{myProductForm.controls.product_categoria.value}}
              </mat-select-trigger>
              @for (categoria of categoriasList; track categoria) {
              <mat-option [value]="categoria">{{categoria}}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </label>
      </div>
    </form>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial (click)="onEdit()">Editar</button>
</mat-dialog-actions>
